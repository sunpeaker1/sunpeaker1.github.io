name: Build Kubae Navi V0.1

on:
  push:
    branches:
      - build/kubae-navi-v0
    paths:
      - 'kubae-navi-build/**'
      - '.github/workflows/kubae-navi-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: kubae-navi-build
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp kubae-navi-build/app/build/outputs/apk/debug/app-debug.apk KubaeNavi-V0.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KubaeNavi-V0.1-debug
          path: KubaeNavi-V0.1-debug.apk
          if-no-files-found: error
          retention-days: 14
