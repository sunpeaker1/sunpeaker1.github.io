name: Publish Kubae Navi V0.1.1 Release

on:
  push:
    branches:
      - build/kubae-navi-v0
    paths:
      - '.github/workflows/kubae-navi-release-v011.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: kubae-navi-build
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp kubae-navi-build/app/build/outputs/apk/debug/app-debug.apk KubaeNavi-V0.1.1-debug.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "kubae-v0.1.1" >/dev/null 2>&1; then
            gh release upload "kubae-v0.1.1" KubaeNavi-V0.1.1-debug.apk --clobber
          else
            gh release create "kubae-v0.1.1" KubaeNavi-V0.1.1-debug.apk \
              --target "$GITHUB_SHA" \
              --title "KubaeNavi V0.1.1 test APK" \
              --notes "Independent KubaeNavi prototype. RiderJjakkung, existing JjakkungNavi, and QuickJjakkung protected code are unchanged." \
              --prerelease
          fi
