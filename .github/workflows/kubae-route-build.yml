name: Build Kubae Route V0.2.1

on:
  push:
    branches:
      - kubae-navi-route-v1
    paths:
      - 'kubae-route/**'
      - '.github/workflows/kubae-route-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: kubae-route
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp kubae-route/app/build/outputs/apk/debug/app-debug.apk KubaeNavi-Route-V0.2.1-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KubaeNavi-Route-V0.2.1-debug
          path: KubaeNavi-Route-V0.2.1-debug.apk
          retention-days: 14

      - name: Publish test Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "kubae-route-v0.2.1" >/dev/null 2>&1; then
            gh release upload "kubae-route-v0.2.1" KubaeNavi-Route-V0.2.1-debug.apk --clobber
          else
            gh release create "kubae-route-v0.2.1" KubaeNavi-Route-V0.2.1-debug.apk \
              --target "$GITHUB_SHA" \
              --title "KubaeNavi Route V0.2.1 test APK" \
              --notes "Corrected route-based prototype. No screen mirroring. Protected RiderJjakkung/JjakkungNavi/QuickJjakkung code unchanged." \
              --prerelease
          fi
