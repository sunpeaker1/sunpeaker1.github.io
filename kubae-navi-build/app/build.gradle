plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kubaenavi.prototype'
    compileSdk 35

    defaultConfig {
        applicationId "com.kubaenavi.prototype"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
