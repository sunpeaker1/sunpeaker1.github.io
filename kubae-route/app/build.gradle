plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kubaenavi.route'
    compileSdk 35

    defaultConfig {
        applicationId "com.kubaenavi.route"
        minSdk 26
        targetSdk 35
        versionCode 33
        versionName "0.3.3"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
